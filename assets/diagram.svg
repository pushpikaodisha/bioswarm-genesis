<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05130E"/>
      <stop offset="100%" stop-color="#0E231B"/>
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="16" fill="url(#bg)"/>
  
  <text x="550" y="38" fill="#00FF87" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">BIOSWARM GENESIS NEURAL PERCEPTION &amp; GENETIC EVOLUTION LOOP</text>
  <text x="550" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Raycast Sensory Whiskers → 2-Layer Neural Perceptron → Motor Actuation → DNA Mutation</text>

  <!-- Sensory Perception Box -->
  <g transform="translate(50, 95)">
    <rect width="260" height="260" rx="12" fill="#0E231B" stroke="#00FF87" stroke-width="1.5"/>
    <text x="130" y="30" fill="#00FF87" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SENSORY RAYCASTS</text>
    
    <rect x="20" y="55" width="220" height="36" rx="6" fill="#133829"/>
    <text x="35" y="77" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">🍏 Nutrient Proximity (d_f)</text>
    
    <rect x="20" y="100" width="220" height="36" rx="6" fill="#133829"/>
    <text x="35" y="122" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">⚠️ Hazard Gradient (d_h)</text>
    
    <rect x="20" y="145" width="220" height="36" rx="6" fill="#133829"/>
    <text x="35" y="167" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">🦈 Predator Vector (θ_p)</text>

    <rect x="20" y="190" width="220" height="36" rx="6" fill="#133829"/>
    <text x="35" y="212" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">⚡ Internal Energy (E_curr)</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M 320 225 L 380 225" stroke="#00FF87" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="385,225 375,220 375,230" fill="#00FF87"/>

  <!-- Neural Perceptron Box -->
  <g transform="translate(390, 95)">
    <rect width="320" height="260" rx="12" fill="#0E231B" stroke="#60EFFF" stroke-width="1.5"/>
    <text x="160" y="30" fill="#60EFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">NEURAL SYNAPSE BRAIN</text>
    
    <!-- Nodes and Synapses visual -->
    <circle cx="60" cy="80" r="14" fill="#00FF87"/>
    <circle cx="60" cy="130" r="14" fill="#00FF87"/>
    <circle cx="60" cy="180" r="14" fill="#00FF87"/>
    <circle cx="60" cy="230" r="14" fill="#00FF87"/>

    <circle cx="260" cy="115" r="16" fill="#60EFFF"/>
    <circle cx="260" cy="195" r="16" fill="#60EFFF"/>

    <!-- Synaptic connection lines -->
    <line x1="74" y1="80" x2="244" y2="115" stroke="#00FF87" stroke-width="2"/>
    <line x1="74" y1="130" x2="244" y2="115" stroke="#EF4444" stroke-width="2"/>
    <line x1="74" y1="180" x2="244" y2="195" stroke="#00FF87" stroke-width="2.5"/>
    <line x1="74" y1="230" x2="244" y2="195" stroke="#60EFFF" stroke-width="1.5"/>

    <text x="160" y="150" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">w_ij Synaptic Matrix</text>
    <text x="160" y="170" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">f(x) = tanh(W·x + b)</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M 720 225 L 780 225" stroke="#60EFFF" stroke-width="2.5" stroke-dasharray="5,3"/>
  <polygon points="785,225 775,220 775,230" fill="#60EFFF"/>

  <!-- Motor Actuation Box -->
  <g transform="translate(790, 95)">
    <rect width="260" height="260" rx="12" fill="#0E231B" stroke="#00FF87" stroke-width="1.5"/>
    <text x="130" y="30" fill="#00FF87" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">MOTOR ACTUATION</text>
    
    <rect x="20" y="70" width="220" height="60" rx="8" fill="#133829"/>
    <text x="130" y="95" fill="#60EFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Steering Angle (Δθ)</text>
    <text x="130" y="115" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Δθ = tanh(Output_1)</text>

    <rect x="20" y="150" width="220" height="60" rx="8" fill="#133829"/>
    <text x="130" y="175" fill="#00FF87" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Propulsion Thrust (F)</text>
    <text x="130" y="195" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">F = Sigmoid(Output_2)</text>
  </g>

  <!-- Genetic Feedback Loop -->
  <g transform="translate(50, 385)">
    <rect width="1000" height="65" rx="8" fill="#081A12" stroke="#133829"/>
    <text x="30" y="30" fill="#00FF87" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🧬 DARWINIAN NATURAL SELECTION &amp; MUTAGENESIS:</text>
    <text x="30" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Creatures surviving starvation reproduce with Gaussian mutations: w_new = w_old + N(0, σ²). Radiation brush triggers instant DNA divergence.</text>
  </g>
</svg>